services:
  postgres:
    image: postgres:16-alpine
    container_name: aura-postgres
    environment:
      POSTGRES_USER: aura
      POSTGRES_PASSWORD: aura
      POSTGRES_DB: aura
    ports:
      - "5432:5432"
    volumes:
      - aura_pg:/var/lib/postgresql/data

  qdrant:
    image: qdrant/qdrant
    container_name: aura-qdrant
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - aura_qdrant:/qdrant/storage

volumes:
  aura_pg:
  aura_qdrant: